name: WASM Build

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project ID to build'
        required: true
        type: string
      branch:
        description: 'Branch to build'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: MobileApp

jobs:
  wasm_build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout user branch
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 2️⃣ Set up JDK & Node (KMP requires both)
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Restore Gradle Remote Cache
      - name: Restore Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-

      # 4️⃣ Build the Wasm/JS browser distribution.
      - name: Build WASM
        run: ./gradlew :webApp:jsBrowserDistribution --no-daemon --parallel -x test -x lint

      # 5️⃣ Upload artifact
      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-output-${{ github.event.inputs.project_id }}
          path: MobileApp/webApp/build/dist/js/productionExecutable
